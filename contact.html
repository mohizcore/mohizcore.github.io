<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — HyPhex Edits</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="wrap">
    <div class="site-title">HyPhex Edits</div>
    <div class="navlinks">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
    </div>
  </div>
</nav>

<div class="page-hero contact-page">
  <div class="page-hero-text">
    <h1>Ready to get your footage cut?</h1>
    <p>Send the form and I'll reply with a quote and turnaround time — usually within a day.</p>
    <form style="margin-top:20px; max-width:420px;" action="https://formspree.io/f/mkjnvrjn" method="POST">
      <div class="form-row">
        <div><label>First name</label><input type="text" name="first_name" placeholder="First name" required></div>
        <div><label>Last name</label><input type="text" name="last_name" placeholder="Last name" required></div>
      </div>
      <div><label>Email</label><input type="email" name="email" placeholder="you@email.com" required></div>
      <div><label>Message</label><textarea name="message" placeholder="Tell me about your project" required></textarea></div>
      <button type="submit" class="submit-btn">Send</button>
    </form>
  </div>
  <div class="page-hero-photo photo ph-4"></div>
</div>

<section>
  <div class="wrap" style="max-width:600px;">
    <p style="color:var(--grey); font-size:0.95rem;">Prefer Instagram? DM <a href="https://instagram.com/mohiz.xyz" target="_blank" style="color:var(--orange-deep); font-weight:600;">@mohiz.xyz</a> directly — that's usually the fastest way to reach me.</p>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="site-title">HyPhex Edits</div>
    <div class="made-with">Instagram: <a href="https://instagram.com/mohiz.xyz" target="_blank">@mohiz.xyz</a></div>
    <div class="socials">mohizcore@gmail.com</div>
  </div>
</footer>

</body>
</html>
